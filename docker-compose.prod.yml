services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notas_db
      POSTGRES_USER: notas_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notas_user -d notas_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://notas_user:${POSTGRES_PASSWORD}@db:5432/notas_db
      STORAGE_PATH: /app/storage
      TESSERACT_CMD: /usr/bin/tesseract
      ENVIRONMENT: production
      FRONTEND_URL: ${FRONTEND_URL}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-50}
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-30}
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # A aplicação roda atrás do proxy do Coolify: o IP real do cliente vem
    # no X-Forwarded-For e precisa ser recuperado para o log e o rate limiting.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr",'
        '"metodo":"$request_method","rota":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duracao":$request_time,'
        '"agente":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Rate limiting (proteção contra uso acidental excessivo)
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=10r/m;

    # Dois PDFs de até 50 MB por requisição.
    client_max_body_size 110M;
    client_body_timeout 300s;

    upstream backend {
        server backend:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        # Usado pelo healthcheck do contêiner e pelo Coolify.
        location = /health {
            access_log off;
            include /etc/nginx/security-headers.conf;
            add_header Content-Type application/json;
            return 200 '{"status":"ok"}';
        }

        # Assets com hash no nome podem ser cacheados indefinidamente.
        location /assets/ {
            include /etc/nginx/security-headers.conf;
            # Sem "expires", que emitiria um segundo Cache-Control.
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # O index.html nunca é cacheado, para que um deploy novo apareça na hora.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Upload e geração: limite mais restrito e sem buffering do corpo.
        location ~ ^/api/notas/(processar|gerar) {
            limit_req zone=upload_zone burst=5 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
        }

        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}

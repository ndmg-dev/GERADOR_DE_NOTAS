# Cabeçalhos de segurança da SPA.
#
# Precisa ser incluído em TODO location que declare o seu próprio add_header:
# no nginx, um add_header no nível atual descarta os herdados do nível acima.
#
# O 'unsafe-inline' em style-src é necessário porque os componentes Radix
# aplicam estilos inline para posicionamento.
#
# X-Frame-Options não suporta múltiplas origens (só DENY/SAMEORIGIN/ALLOW-FROM,
# este último já removido dos navegadores modernos), por isso o controle de
# quem pode embutir a aplicação em iframe fica só no frame-ancestors do CSP,
# que os navegadores atuais respeitam e sobrepõe ao X-Frame-Options.

add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self' https://crmmg.mendoncagalvao.com.br; base-uri 'self'" always;
